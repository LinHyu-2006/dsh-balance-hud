name: CI

# Both verification scripts are fully offline: no DSH install, no network,
# no build step. That is why they can run in a clean container.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly macOS run (see the macos job for why it is not on every push).
    - cron: '0 3 * * 1'

jobs:
  verify:
    name: smoke + packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin is a hand-written bundle with no build step. Running on
        # both platforms proves that line endings (.gitattributes pins LF),
        # path derivation and `import.meta` usage do not depend on Windows.
        os: [ubuntu-latest, windows-latest]
    steps:
      # v7 targets the Node 24 action runtime; v4 still targeted Node 20,
      # which GitHub now deprecates on hosted runners.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Offline smoke suite
        run: node tools/smoke.mjs

      - name: Packaging self-check
        # Does not need a DSH install: it only checks the manifest, the patch
        # file and the shape of both entry points.
        run: node tools/verify-install.mjs --package

  macos:
    # macOS is checked weekly and on demand rather than on every push.
    #
    # GitHub's own annotation says it plainly:
    #   "The job was not acquired by Runner of type hosted even after
    #    multiple attempts"
    #   "Due to capacity constraints, jobs targeting macOS arm64 runners may
    #    experience longer queue times."
    # A job that never gets a runner settles as `cancelled`, which marks the
    # whole run red for a reason that has nothing to do with the code — and a
    # permanently red badge is worse than slightly less coverage.
    #
    # The plugin is pure JavaScript with no native dependencies, and Linux
    # already exercises the POSIX code path, so weekly macOS coverage plus
    # `continue-on-error` is the honest trade-off: still tested, never noisy.
    name: smoke + packaging (macos-latest)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Offline smoke suite
        run: node tools/smoke.mjs

      - name: Packaging self-check
        run: node tools/verify-install.mjs --package
